  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* =========================
       전체 앱
    ========================= */

    .app {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 26px;
      padding: 38px 32px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* =========================
       제목
    ========================= */

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      color: #222;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 10px;
      margin-bottom: 30px;
      font-size: 15px;
      color: #999;
    }

    /* =========================
       카테고리
    ========================= */

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-bottom: 30px;
    }

    .category {
      border: 1px solid #e4dfd8;
      background: #ffffff;
      color: #666;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .category:hover {
      border-color: #ff8a65;
      color: #ff7043;
      transform: translateY(-2px);
    }

    .category.active {
      background: #ff7043;
      border-color: #ff7043;
      color: #ffffff;
      box-shadow:
        0 4px 12px rgba(255, 112, 67, 0.2);
    }

    .category:active {
      transform: scale(0.95);
    }

    /* =========================
       추천 결과 카드
    ========================= */

    .result-card {
      position: relative;
      width: 100%;
      min-height: 225px;
      border-radius: 22px;
      background: #fcfaf7;
      border: 1px solid #eee8df;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow:
        0 6px 18px rgba(80, 60, 40, 0.05);
    }

    /*
      카드 상단의 작은 포인트
    */

    .result-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #ff7043;
    }

    /* =========================
       오늘의 추천 라벨
    ========================= */

    .result-label {
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: 600;
      color: #ff7043;
      letter-spacing: 0.5px;
    }

    /* =========================
       기본 상태 아이콘
    ========================= */

    #foodEmoji {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 14px;
    }

    /* =========================
       음식 이름
    ========================= */

    #result {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      color: #292929;
      min-height: 36px;
      letter-spacing: -0.8px;
    }

    /* 처음 상태 */

    #result.empty {
      font-size: 20px;
      font-weight: 500;
      color: #999;
      letter-spacing: 0;
    }

    /* =========================
       결과 등장 애니메이션
    ========================= */

    .result-card.show {
      animation: resultShow 0.45s ease;
    }

    @keyframes resultShow {

      0% {
        opacity: 0;
        transform:
          translateY(8px)
          scale(0.97);
      }

      60% {
        transform:
          translateY(-2px)
          scale(1.01);
      }

      100% {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }

    /* =========================
       버튼 공통
    ========================= */

    #recommendButton,
    #retryButton {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    /* =========================
       메뉴 추천받기
    ========================= */

    #recommendButton {
      background: #ff7043;
      color: #ffffff;
      box-shadow:
        0 6px 14px rgba(255, 112, 67, 0.22);
    }

    #recommendButton:hover {
      background: #f4511e;
      transform: translateY(-2px);
      box-shadow:
        0 8px 18px rgba(255, 112, 67, 0.27);
    }

    /* =========================
       다른 메뉴 추천
    ========================= */

    #retryButton {
      display: none;
      background: #fff0eb;
      color: #e85d3f;
      box-shadow: none;
    }

    #retryButton:hover {
      background: #ffe3db;
      transform: translateY(-2px);
    }

    /* =========================
       버튼 비활성화
    ========================= */

    button:disabled {
      cursor: default;
      opacity: 0.6;
      transform: none !important;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .app {
        padding: 30px 20px;
        border-radius: 22px;
      }

      h1 {
        font-size: 28px;
      }

        font-size: 14px;
        margin-bottom: 26px;
      }

        font-size: 13px;
      }

      .result-card {
        min-height: 210px;
      }

      #foodEmoji {
        font-size: 50px;
      }

      #result {
        font-size: 26px;
      }

    }

  </style>
</head>

    function selectCategory(category, button) {

      selectedCategory = category;

        .querySelectorAll(".category")
        .forEach(function(item) {

      resultCard.classList.remove("show");

        "recommendButton"
      ).style.display = "block";

        "retryButton"
      ).style.display = "none";

        );

      const resultCard =
        document.getElementById(
          "resultCard"
        );


      /* 버튼 잠금 */

      recommendButton.disabled = true;
      retryButton.disabled = true;


      /* =========================
         메뉴 필터링
      ========================= */

      let filteredFoods;


      if (selectedCategory === "전체") {

        filteredFoods = foods;

      } else {

        filteredFoods =
          foods.filter(function(food) {

            return food.category === selectedCategory;

          });

      }


      /* 랜덤 선택 */

      const selectedFood =
        filteredFoods[
          Math.floor(
            Math.random() *
            filteredFoods.length
          )
        ];


      /* 기존 애니메이션 제거 */

      resultCard.classList.remove("show");


      /* 결과 표시 */

      setTimeout(function() {

        /*
          추천 결과에서는
          기본 🍽️ 아이콘 숨김
        */

        foodEmoji.style.display =
          "none";


        result.textContent =
          selectedFood.name;

        result.classList.remove(
          "empty"
        );

        resultCard.classList.add(
          "show"
        );


        /*
          첫 추천 버튼 숨김
        */

        recommendButton.style.display =
          "none";


        /*
          다른 메뉴 추천 표시
        */

        retryButton.style.display =
          "block";


        recommendButton.disabled =
          false;

        retryButton.disabled =
          false;

        isSelecting = false;


      }, 400);

    }

  </script>

</body>
</html>
